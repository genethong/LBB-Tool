<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Energy Analysis Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root { --accent: #3b82f6; --accent-dark: #2563eb; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 16px;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 36px 32px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .brand-block {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-block h4 {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      margin: 10px 0 4px;
    }
    .brand-block p {
      color: #64748b;
      font-size: 13px;
      margin: 0;
    }
    .form-label {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-control {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
    }
    .form-control:focus {
      background: #0f172a;
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .form-control::placeholder { color: #475569; }
    .btn-login {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 11px;
      margin-top: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-login:hover { background: var(--accent-dark); }
    .error-box {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .footer-note {
      text-align: center;
      margin-top: 20px;
      color: #475569;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">

      <div class="brand-block">
        <img src="{{ url_for('static', filename='edotco-logo.png') }}"
             alt="Edotco" style="height:36px;object-fit:contain;"
             onerror="this.style.display='none'">
        <h4>Energy Analysis Tool</h4>
        <p>Edotco Group · Sign in to continue</p>
      </div>

      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login_page', next=request.args.get('next','')) }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control"
                 placeholder="Enter your username"
                 autofocus autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control"
                 placeholder="Enter your password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>

    </div>
    <div class="footer-note">
      Contact your admin to create or reset an account.
    </div>
  </div>
</body>
</html>
